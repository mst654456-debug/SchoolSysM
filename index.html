<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>نظام إدارة المدارس - إدارة سمالوط التعليمية</title>
<style>
:root{--ind:#4f46e5;--ind2:#4338ca;--pale:#eef2ff;--bg:#f7f8fc;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--green:#15803d;--red:#dc2626;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
#layout{display:flex;min-height:100vh}aside{width:255px;background:#fff;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
.brand{font-size:19px;font-weight:bold;color:var(--ind);padding:8px 4px 18px;border-bottom:1px solid var(--line)}
nav{display:grid;gap:7px}nav button{border:0;background:white;text-align:right;padding:12px;border-radius:9px;color:#4b5563}nav button.active,nav button:hover{background:var(--pale);color:var(--ind);font-weight:bold}
.sidefoot{margin-top:auto;display:grid;gap:8px}main{padding:24px;flex:1;min-width:0;max-width:1500px;margin:auto;width:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 14px}p{line-height:1.7}
.btn{border:1px solid var(--line);background:white;color:var(--text);border-radius:8px;padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ind);color:white;border-color:var(--ind)}.btn.danger{color:var(--red)}.btn:hover{filter:brightness(.97)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 3px #00000008}
.hero{background:linear-gradient(130deg,#4f46e5,#2563eb);color:white;border-radius:15px;padding:26px;margin-bottom:18px}.hero h2{font-size:26px;margin-bottom:8px}.hero p{margin:0;color:#e0e7ff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat small{color:var(--muted);font-weight:bold}.stat strong{display:block;font-size:30px;margin-top:8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{flex:1;min-width:180px}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;background:white;color:var(--text)}textarea{min-height:110px;resize:vertical}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px}.field{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.item h3{margin:0 0 8px;font-size:17px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px;line-height:1.8}.tag{display:inline-block;border-radius:30px;background:var(--pale);color:var(--ind);padding:4px 9px;font-size:12px;margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:35px;border:1px dashed var(--line);border-radius:10px;grid-column:1/-1}
table{width:100%;border-collapse:collapse;background:white}th,td{text-align:right;border-bottom:1px solid var(--line);padding:11px 9px;vertical-align:top}th{background:#f9fafb;font-size:13px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
.modalback{position:fixed;inset:0;background:#11182788;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal{background:white;border-radius:14px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.hidden{display:none!important}.notice{background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:8px;font-size:13px;color:#92400e;margin-bottom:14px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr 1fr}aside{width:220px}main{padding:16px}}
@media(max-width:650px){#layout{display:block}aside{width:auto;border-left:0;border-bottom:1px solid var(--line);padding:10px}nav{grid-template-columns:repeat(2,minmax(0,1fr))}nav button{padding:9px;font-size:13px}.sidefoot{grid-template-columns:1fr 1fr;margin-top:0}.brand{padding:7px;border:0}main{padding:12px}.grid,.stats{grid-template-columns:1fr}h1{font-size:21px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:20px}.hero h2{font-size:22px}}
@media print{aside,.no-print,header .actions{display:none!important}#layout,main{display:block;padding:0;margin:0;max-width:none}.card,.hero{box-shadow:none;border:1px solid #ccc}.hero{background:white;color:black}.hero p{color:black}.grid{grid-template-columns:repeat(2,1fr)}body{background:white}}
</style>
</head>
<body>
<div id="layout">
<aside>
  <div class="brand">▦ نظام إدارة المدارس</div>
  <nav id="nav">
    <button class="active" data-page="home">⌂ الرئيسية</button>
    <button data-page="schools">▦ المدارس والجهات</button>
    <button data-page="teachers">♙ المعلمون والموظفون</button>
    <button data-page="events">▤ الأحداث اليومية</button>
    <button data-page="reports">▧ التقارير</button>
  </nav>
  <div class="sidefoot no-print">
    <button class="btn" id="exportBtn">تصدير نسخة احتياطية</button>
    <button class="btn" id="importBtn">استيراد نسخة احتياطية</button>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
  </div>
</aside>
<main>
  <header><h1 id="pageTitle">الرئيسية</h1><div class="actions no-print"><button class="btn" onclick="window.print()">طباعة الصفحة</button></div></header>
  <div id="page"></div>
</main>
</div>
<div id="modalRoot"></div>
<script>
const KEY='school_mgmt_excel_v2';
const INITIAL_DB={
 schools:[
  {id:1,name:"ديوان الإدارة",code:"SCH-001",address:"سمالوط، المنيا",total_staff_count:659},
  {id:2,name:"المستبعدين",code:"SCH-002",address:"سمالوط، المنيا",total_staff_count:128},
  {id:3,name:"التجريبيه",code:"SCH-003",address:"سمالوط، المنيا",total_staff_count:1034},
  {id:4,name:"الزراعه بنين ث",code:"SCH-004",address:"سمالوط، المنيا",total_staff_count:320},
  {id:5,name:"التجاره بنات ث",code:"SCH-005",address:"سمالوط، المنيا",total_staff_count:316},
  {id:6,name:"الفنيه بنات ث",code:"SCH-006",address:"سمالوط، المنيا",total_staff_count:260},
  {id:7,name:"الصناعه بنين ث",code:"SCH-007",address:"سمالوط، المنيا",total_staff_count:220}
 ],
 teachers:[
  {id:1,school_id:1,name:"ابتسام سيد عبد القادر على",national_id:"27012092401201",code:"T00001",phone:"",job_grade:"إداري ديوان",role:"موظف ديوان",employment_status:"ديوان",notes:""},
  {id:2,school_id:1,name:"ابراهيم الدسوقى على السيد فضل",national_id:"26311162400855",code:"T00002",phone:"",job_grade:"إداري ديوان",role:"موظف ديوان",employment_status:"ديوان",notes:""},
  {id:3,school_id:2,name:"محمد محمد عبد الوهاب خلف",national_id:"28312122402476",code:"T00003",phone:"",job_grade:"مستبعد",role:"مستبعد",employment_status:"مستبعد",notes:"قائمة المستبعدين"},
  {id:4,school_id:3,name:"ابراهيم عبد الخالق ابراهيم عبد السلام",national_id:"26807192401118",code:"T00004",phone:"",job_grade:"معلم",role:"معلم",employment_status:"اصلى",notes:""}
 ],
 events:[],seq:{schools:8,teachers:5,events:1}
};
function loadDB(){try{const raw=localStorage.getItem(KEY);if(!raw){localStorage.setItem(KEY,JSON.stringify(INITIAL_DB));return structuredClone(INITIAL_DB)}const d=JSON.parse(raw);return {...INITIAL_DB,...d,schools:d.schools||[],teachers:d.teachers||[],events:d.events||[],seq:{...INITIAL_DB.seq,...d.seq}}}catch(e){return structuredClone(INITIAL_DB)}}
let db=loadDB(),currentPage='home',searchTerms={schools:'',teachers:'',events:''},filters={status:'',school:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر الحفظ. قد تكون مساحة التخزين ممتلئة. صدّر نسخة احتياطية واحذف الصور الكبيرة إن وجدت.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function schoolName(id){return db.schools.find(s=>s.id===Number(id))?.name||'جهة غير محددة'}
function nextId(type){const id=Number(db.seq[type]||1);db.seq[type]=id+1;return id}
function setPage(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
function render(){const titles={home:'الرئيسية',schools:'المدارس والجهات',teachers:'المعلمون والموظفون',events:'الأحداث اليومية',reports:'التقارير'};document.getElementById('pageTitle').textContent=titles[currentPage];const pages={home:homePage,schools:schoolsPage,teachers:teachersPage,events:eventsPage,reports:reportsPage};document.getElementById('page').innerHTML=pages[currentPage]();bindPageEvents()}
function homePage(){return `<div class="hero"><h2>نظام إدارة المدارس - سمالوط</h2><p>إدارة المدارس والجهات والمعلمين والموظفين وتسجيل الأحداث اليومية وإعداد التقارير.</p></div>
<div class="stats"><div class="card stat"><small>المدارس والجهات</small><strong>${db.schools.length}</strong></div><div class="card stat"><small>المعلمون والموظفون</small><strong>${db.teachers.length}</strong></div><div class="card stat"><small>الأحداث المسجلة</small><strong>${db.events.length}</strong></div></div>
<div class="card"><h2>آخر الأحداث</h2>${db.events.length?`<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>الحدث</th><th>الجهة</th></tr></thead><tbody>${[...db.events].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${esc(schoolName(e.school_id))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد أحداث مسجلة حتى الآن.</div>'}</div>`}
function schoolsPage(){const q=(searchTerms.schools||'').toLowerCase();const rows=db.schools.filter(s=>(s.name+' '+s.code+' '+s.address).toLowerCase().includes(q));return `<div class="toolbar no-print"><input id="schoolSearch" placeholder="بحث باسم المدرسة أو الكود أو العنوان..." value="${esc(searchTerms.schools)}"><button class="btn primary" id="addSchool">＋ إضافة مدرسة / جهة</button></div><div class="grid">${rows.length?rows.map(s=>`<div class="card item"><h3>${esc(s.name)}</h3><div class="muted">الكود: ${esc(s.code)}</div><div class="muted">العنوان: ${esc(s.address)}</div><div class="tag">عدد الموظفين المسجل: ${Number(s.total_staff_count)||0}</div><div class="actions no-print" style="margin-top:14px"><button class="btn" data-edit-school="${s.id}">تعديل</button><button class="btn danger" data-delete-school="${s.id}">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد مدارس مطابقة.</div>'}</div>`}
function teachersPage(){const q=(searchTerms.teachers||'').trim().toLowerCase();const rows=db.teachers.filter(t=>(`${t.name} ${t.national_id} ${t.code} ${t.phone} ${t.role}`).toLowerCase().includes(q)&&(!filters.status||t.employment_status===filters.status)&&(!filters.school||Number(t.school_id)===Number(filters.school)));return `<div class="toolbar no-print"><input id="teacherSearch" placeholder="ابحث بالاسم أو الرقم القومي أو الكود..." value="${esc(searchTerms.teachers)}"><select id="teacherStatus"><option value="">كل الحالات</option>${[['اصلى','أصلي'],['ديوان','الديوان'],['مستبعد','مستبعد']].map(([v,l])=>`<option value="${v}" ${filters.status===v?'selected':''}>${l}</option>`).join('')}</select><select id="teacherSchool"><option value="">كل الجهات</option>${db.schools.map(s=>`<option value="${s.id}" ${Number(filters.school)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="btn primary" id="addTeacher">＋ إضافة موظف</button></div><div class="grid">${rows.length?rows.map(t=>`<div class="card item"><div class="actions" style="justify-content:space-between"><h3>${esc(t.name)}</h3><span class="tag">${esc(t.employment_status||'أصلي')}</span></div><div class="muted">${esc(schoolName(t.school_id))}</div><p style="margin:10px 0 0;font-size:14px;line-height:1.9"><b>الرقم القومي:</b> ${esc(t.national_id)}<br><b>الكود:</b> ${esc(t.code)}<br><b>الوظيفة:</b> ${esc(t.job_grade)}<br><b>المسمى الوظيفي:</b> ${esc(t.role)}<br><b>الهاتف:</b> ${esc(t.phone||'—')}</p>${t.notes?`<p class="muted"><b>ملاحظات:</b> ${esc(t.notes)}</p>`:''}<div class="actions no-print" style="margin-top:12px"><button class="btn" data-edit-teacher="${t.id}">تعديل</button><button class="btn danger" data-delete-teacher="${t.id}">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد سجلات مطابقة للبحث.</div>'}</div>`}
function eventsPage(){const q=(searchTerms.events||'').toLowerCase();const rows=[...db.events].filter(e=>(`${e.title} ${e.description} ${e.date} ${schoolName(e.school_id)}`).toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="toolbar no-print"><input id="eventSearch" placeholder="ابحث في عنوان الحدث أو الوصف أو التاريخ..." value="${esc(searchTerms.events)}"><button class="btn primary" id="addEvent">＋ تسجيل حدث</button></div><div class="grid">${rows.length?rows.map(e=>`<div class="card item"><h3>${esc(e.title)}</h3><div class="muted">التاريخ: ${esc(e.date)} ${e.time?`— ${esc(e.time)}`:''}</div><div class="muted">الجهة: ${esc(schoolName(e.school_id))}</div>${e.teacher_id?`<div class="muted">الموظف: ${esc(db.teachers.find(t=>t.id===Number(e.teacher_id))?.name||'غير محدد')}</div>`:''}<p style="white-space:pre-wrap">${esc(e.description||'لا يوجد وصف')}</p>${e.image?`<img src="${e.image}" alt="صورة الحدث" style="max-width:100%;max-height:180px;border-radius:8px">`:''}<div class="actions no-print" style="margin-top:12px"><button class="btn" data-report-event="${e.id}">التقرير والطباعة</button><button class="btn" data-edit-event="${e.id}">تعديل</button><button class="btn danger" data-delete-event="${e.id}">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد أحداث. اضغط «تسجيل حدث» لإضافة أول حدث.</div>'}</div>`}
function reportsPage(){const month=new Date().toISOString().slice(0,7);const chosen=window.reportMonth||month;const events=db.events.filter(e=>(e.date||'').startsWith(chosen));return `<div class="stats"><div class="card stat"><small>عدد المدارس والجهات</small><strong>${db.schools.length}</strong></div><div class="card stat"><small>عدد المعلمين والموظفين</small><strong>${db.teachers.length}</strong></div><div class="card stat"><small>إجمالي الأحداث</small><strong>${db.events.length}</strong></div></div><div class="card"><div class="toolbar no-print"><div style="flex:1;min-width:180px"><label for="reportMonth">اختر شهر التقرير</label><input type="month" id="reportMonth" value="${esc(chosen)}"></div><button class="btn" id="printReport" style="align-self:end">طباعة التقرير</button><button class="btn primary" id="exportCsv" style="align-self:end">تصدير أحداث CSV</button></div><h2>تقرير الأحداث لشهر ${esc(chosen)}</h2><p class="muted">عدد الأحداث خلال الشهر: ${events.length}</p>${events.length?`<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>عنوان الحدث</th><th>الجهة</th><th>الوصف</th></tr></thead><tbody>${events.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${esc(schoolName(e.school_id))}</td><td style="white-space:pre-wrap">${esc(e.description)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">لا توجد أحداث في هذا الشهر.</div>'}</div>`}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn" id="closeModal">إغلاق ✕</button></div>${body}</div></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function schoolOptions(selected){return `<option value="">— اختر الجهة —</option>${db.schools.map(s=>`<option value="${s.id}" ${Number(selected)===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}`}
function teacherOptions(selected){return `<option value="">— غير مرتبط بموظف —</option>${db.teachers.map(t=>`<option value="${t.id}" ${Number(selected)===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}`}
function schoolForm(id){const s=db.schools.find(x=>x.id===Number(id))||{name:'',code:'',address:'',total_staff_count:0};modal(id?'تعديل بيانات المدرسة':'إضافة مدرسة / جهة',`<form id="schoolForm"><div class="formgrid"><div class="field"><label>اسم المدرسة أو الجهة *</label><input name="name" required value="${esc(s.name)}"></div><div class="field"><label>الكود</label><input name="code" value="${esc(s.code)}"></div><div class="field full"><label>العنوان</label><input name="address" value="${esc(s.address)}"></div><div class="field full"><label>عدد الموظفين (اختياري)</label><input name="total_staff_count" type="number" min="0" value="${Number(s.total_staff_count)||0}"></div></div><div class="actions"><button class="btn primary">حفظ البيانات</button><button type="button" class="btn" id="cancelForm">إلغاء</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('schoolForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={name:f.get('name').trim(),code:f.get('code').trim(),address:f.get('address').trim(),total_staff_count:Number(f.get('total_staff_count'))||0};if(id)Object.assign(s,obj);else db.schools.push({id:nextId('schools'),...obj});save();closeModal();render()}}
function teacherForm(id){const t=db.teachers.find(x=>x.id===Number(id))||{name:'',national_id:'',code:'',phone:'',school_id:'',job_grade:'',role:'',employment_status:'اصلى',notes:''};modal(id?'تعديل بيانات الموظف':'إضافة معلم / موظف',`<form id="teacherForm"><div class="formgrid"><div class="field full"><label>الاسم بالكامل *</label><input name="name" required value="${esc(t.name)}"></div><div class="field"><label>الرقم القومي</label><input name="national_id" inputmode="numeric" value="${esc(t.national_id)}"></div><div class="field"><label>الكود الوظيفي</label><input name="code" value="${esc(t.code)}"></div><div class="field"><label>الجهة / المدرسة</label><select name="school_id">${schoolOptions(t.school_id)}</select></div><div class="field"><label>الحالة</label><select name="employment_status">${[['اصلى','أصلي'],['ديوان','الديوان'],['مستبعد','مستبعد']].map(([v,l])=>`<option value="${v}" ${t.employment_status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>الدرجة / الوظيفة</label><input name="job_grade" value="${esc(t.job_grade)}"></div><div class="field"><label>المسمى الوظيفي</label><input name="role" value="${esc(t.role)}"></div><div class="field full"><label>رقم الهاتف</label><input name="phone" value="${esc(t.phone)}"></div><div class="field full"><label>ملاحظات</label><textarea name="notes">${esc(t.notes)}</textarea></div></div><div class="actions"><button class="btn primary">حفظ البيانات</button><button type="button" class="btn" id="cancelForm">إلغاء</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('teacherForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={name:f.get('name').trim(),national_id:f.get('national_id').trim(),code:f.get('code').trim(),phone:f.get('phone').trim(),school_id:f.get('school_id')?Number(f.get('school_id')):null,job_grade:f.get('job_grade').trim(),role:f.get('role').trim(),employment_status:f.get('employment_status'),notes:f.get('notes').trim()};if(id)Object.assign(t,obj);else{if(!obj.code)obj.code='T'+String(db.seq.teachers).padStart(5,'0');db.teachers.push({id:nextId('teachers'),...obj})}save();closeModal();render()}}
function eventForm(id){const ev=db.events.find(x=>x.id===Number(id))||{title:'',date:new Date().toISOString().slice(0,10),time:'',school_id:'',teacher_id:'',description:'',image:''};modal(id?'تعديل الحدث':'تسجيل حدث يومي',`<form id="eventForm"><div class="formgrid"><div class="field full"><label>عنوان الحدث *</label><input name="title" required value="${esc(ev.title)}"></div><div class="field"><label>تاريخ الحدث *</label><input name="date" type="date" required value="${esc(ev.date)}"></div><div class="field"><label>الوقت</label><input name="time" type="time" value="${esc(ev.time)}"></div><div class="field"><label>المدرسة / الجهة</label><select name="school_id">${schoolOptions(ev.school_id)}</select></div><div class="field"><label>المعلم / الموظف المرتبط</label><select name="teacher_id">${teacherOptions(ev.teacher_id)}</select></div><div class="field full"><label>وصف الحدث (يمكن كتابة عدة أسطر)</label><textarea name="description">${esc(ev.description)}</textarea></div><div class="field full"><label>صورة للحدث (اختياري)</label><input type="file" name="imageFile" accept="image/*"><small class="muted">الصورة تُحفظ داخل المتصفح؛ تجنب الصور كبيرة الحجم حتى لا تمتلئ مساحة التخزين.</small>${ev.image?`<div style="margin-top:8px"><img src="${ev.image}" style="max-width:150px;max-height:100px;border-radius:8px"><label><input type="checkbox" name="removeImage" style="width:auto"> حذف الصورة الحالية</label></div>`:''}</div></div><div class="actions"><button class="btn primary">حفظ الحدث</button><button type="button" class="btn" id="cancelForm">إلغاء</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('eventForm').onsubmit=async e=>{e.preventDefault();const form=e.target,f=new FormData(form),file=form.elements.imageFile.files[0];let image=ev.image||'';if(form.elements.removeImage?.checked)image='';if(file){if(file.size>1200000){alert('حجم الصورة أكبر من 1.2 ميجابايت. اختر صورة أصغر.');return}image=await fileToDataURL(file)}const obj={title:f.get('title').trim(),date:f.get('date'),time:f.get('time'),school_id:f.get('school_id')?Number(f.get('school_id')):null,teacher_id:f.get('teacher_id')?Number(f.get('teacher_id')):null,description:f.get('description').trim(),image};if(id)Object.assign(ev,obj);else db.events.push({id:nextId('events'),createdAt:new Date().toISOString(),...obj});save();closeModal();render()}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function eventReport(id){const e=db.events.find(x=>x.id===Number(id));if(!e)return;const t=db.teachers.find(x=>x.id===Number(e.teacher_id));modal('التقرير النهائي للحدث',`<div id="eventPrintable" class="card"><div style="text-align:center;border-bottom:2px solid #4f46e5;padding-bottom:14px;margin-bottom:16px"><h2>إدارة سمالوط التعليمية</h2><h3>التقرير النهائي للحدث</h3></div><p><b>عنوان الحدث:</b> ${esc(e.title)}</p><p><b>التاريخ والوقت:</b> ${esc(e.date)} ${esc(e.time||'')}</p><p><b>المدرسة / الجهة:</b> ${esc(schoolName(e.school_id))}</p>${t?`<p><b>اسم الموظف:</b> ${esc(t.name)}</p><p><b>الكود:</b> ${esc(t.code)} | <b>الوظيفة:</b> ${esc(t.role)} | <b>الدرجة:</b> ${esc(t.job_grade)}</p><p><b>الرقم القومي:</b> ${esc(t.national_id)}</p><p><b>ملاحظات الموظف:</b> ${esc(t.notes)}</p>`:''}<p><b>وصف الحدث:</b></p><p style="white-space:pre-wrap">${esc(e.description||'لا يوجد وصف')}</p>${e.image?`<img src="${e.image}" style="max-width:100%;max-height:280px">`:''}<p class="muted" style="margin-top:20px">تاريخ إعداد التقرير: ${new Date().toLocaleDateString('ar-EG')}</p></div><div class="actions no-print" style="margin-top:14px"><button class="btn primary" id="printEvent">طباعة التقرير</button><button class="btn" id="copyEvent">نسخ نص التقرير</button><button class="btn" id="shareEvent">مشاركة</button></div>`);document.getElementById('printEvent').onclick=()=>printSpecific('eventPrintable');const reportText=`إدارة سمالوط التعليمية\\nالتقرير النهائي للحدث\\nعنوان الحدث: ${e.title}\\nالتاريخ: ${e.date} ${e.time||''}\\nالجهة: ${schoolName(e.school_id)}\\n${t?'الموظف: '+t.name+'\\nالكود: '+t.code+'\\nالوظيفة: '+t.role+'\\nالدرجة: '+t.job_grade+'\\nالرقم القومي: '+t.national_id+'\\n':''}وصف الحدث:\\n${e.description||''}`;document.getElementById('copyEvent').onclick=async()=>{try{await navigator.clipboard.writeText(reportText);alert('تم نسخ التقرير.')}catch{prompt('انسخ التقرير من هنا:',reportText)}};document.getElementById('shareEvent').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'التقرير النهائي للحدث',text:reportText})}catch{}}else{try{await navigator.clipboard.writeText(reportText);alert('تم نسخ التقرير، ويمكنك لصقه في واتساب.')}catch{prompt('انسخ التقرير للمشاركة:',reportText)}}}}
function printSpecific(id){const content=document.getElementById(id).innerHTML;const w=window.open('','_blank');if(!w){alert('اسمح بفتح النوافذ المنبثقة للطباعة.');return}w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>تقرير</title><style>body{font-family:Tahoma,Arial;padding:25px;line-height:1.8}h2,h3{text-align:center}img{max-width:100%}</style></head><body>${content}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),400)}
function bindPageEvents(){
 const byId=id=>document.getElementById(id);
 if(byId('schoolSearch'))byId('schoolSearch').oninput=e=>{searchTerms.schools=e.target.value;const pos=e.target.selectionStart;render();const n=byId('schoolSearch');n.focus();n.setSelectionRange(pos,pos)};
 if(byId('teacherSearch'))byId('teacherSearch').oninput=e=>{searchTerms.teachers=e.target.value;const pos=e.target.selectionStart;render();const n=byId('teacherSearch');n.focus();n.setSelectionRange(pos,pos)};
 if(byId('teacherStatus'))byId('teacherStatus').onchange=e=>{filters.status=e.target.value;render()};
 if(byId('teacherSchool'))byId('teacherSchool').onchange=e=>{filters.school=e.target.value;render()};
 if(byId('eventSearch'))byId('eventSearch').oninput=e=>{searchTerms.events=e.target.value;const pos=e.target.selectionStart;render();const n=byId('eventSearch');n.focus();n.setSelectionRange(pos,pos)};
 if(byId('addSchool'))byId('addSchool').onclick=()=>schoolForm();
 if(byId('addTeacher'))byId('addTeacher').onclick=()=>teacherForm();
 if(byId('addEvent'))byId('addEvent').onclick=()=>eventForm();
 document.querySelectorAll('[data-edit-school]').forEach(b=>b.onclick=()=>schoolForm(b.dataset.editSchool));
 document.querySelectorAll('[data-edit-teacher]').forEach(b=>b.onclick=()=>teacherForm(b.dataset.editTeacher));
 document.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>eventForm(b.dataset.editEvent));
 document.querySelectorAll('[data-report-event]').forEach(b=>b.onclick=()=>eventReport(b.dataset.reportEvent));
 document.querySelectorAll('[data-delete-school]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.deleteSchool);if(db.teachers.some(t=>Number(t.school_id)===id)||db.events.some(e=>Number(e.school_id)===id)){alert('لا يمكن حذف هذه الجهة لأنها مرتبطة بموظفين أو أحداث. غيّر ارتباط السجلات أولًا.');return}if(confirm('هل تريد حذف هذه الجهة؟')){db.schools=db.schools.filter(s=>s.id!==id);save();render()}});
 document.querySelectorAll('[data-delete-teacher]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.deleteTeacher);if(confirm('هل تريد حذف بيانات هذا الموظف؟')){db.teachers=db.teachers.filter(t=>t.id!==id);save();render()}});
 document.querySelectorAll('[data-delete-event]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.deleteEvent);if(confirm('هل تريد حذف هذا الحدث؟')){db.events=db.events.filter(e=>e.id!==id);save();render()}});
 if(byId('reportMonth'))byId('reportMonth').onchange=e=>{window.reportMonth=e.target.value;render()};
 if(byId('printReport'))byId('printReport').onclick=()=>print();
 if(byId('exportCsv'))byId('exportCsv').onclick=exportEventsCSV;
}
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'});downloadBlob(blob,'نسخة-احتياطية-إدارة-المدارس.json')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.schools)||!Array.isArray(incoming.teachers)||!Array.isArray(incoming.events))throw new Error('bad');if(confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. هل تريد المتابعة؟')){db={...INITIAL_DB,...incoming,seq:{...INITIAL_DB.seq,...incoming.seq}};save();setPage(currentPage);alert('تم استيراد البيانات بنجاح.')}}catch{alert('الملف غير صالح أو ليس نسخة احتياطية من هذا التطبيق.')}e.target.value=''};
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportEventsCSV(){const rows=[['التاريخ','الوقت','عنوان الحدث','الجهة','الموظف','الوصف']];db.events.forEach(e=>rows.push([e.date,e.time,e.title,schoolName(e.school_id),db.teachers.find(t=>t.id===Number(e.teacher_id))?.name||'',e.description]));const csv='\\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'تقرير-الأحداث.csv')}
render();
</script>
</body>
</html>
